name: DARKNET APK Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK compatibility library
        run: |
          sudo apt-get update
          sudo apt-get install -y libtinfo5

      - name: Build Debug APK
        env:
          PSIPHON_PROPAGATION_CHANNEL_ID: ${{ secrets.PSIPHON_PROPAGATION_CHANNEL_ID }}
          PSIPHON_SPONSOR_ID: ${{ secrets.PSIPHON_SPONSOR_ID }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify embedded configuration
        run: |
          FILE="app/src/main/java/com/psiphon3/psiphonlibrary/EmbeddedValues.java"

          test -f "$FILE" || exit 1

          grep -Eq 'PROPAGATION_CHANNEL_ID = ""' "$FILE" && {
            echo "ERROR: Propagation ID EMPTY"
            exit 1
          }

          grep -Eq 'SPONSOR_ID = ""' "$FILE" && {
            echo "ERROR: Sponsor ID EMPTY"
            exit 1
          }

          echo "Propagation ID: NONEMPTY"
          echo "Sponsor ID: NONEMPTY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: darknet-apk
          path: app/build/outputs/apk/**/*.apk
