name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Debug APK
        env:
          PSIPHON_PROPAGATION_CHANNEL_ID: EE0B7486ACAE75AA
          PSIPHON_SPONSOR_ID: EE0B7486ACAE75AA
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: darknet-apk
          path: app/build/outputs/apk/**/*.apk
